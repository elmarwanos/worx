  <link rel="stylesheet" href="../static/css/blog-post.css">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../static/js/nav.js"></script>
  <script src="../static/js/animations.js"></script>
  <script src="../static/js/main.js"></script>

  <script>
    (() => {
      const pageUrl = window.location.href;
      const pageTitle = document.title;
      document.querySelectorAll('[data-share]').forEach((button) => {
        button.addEventListener('click', async (event) => {
          event.preventDefault();
          const network = button.dataset.share;
          if (network === 'linkedin') {
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl)}`,'_blank','noopener,noreferrer,width=720,height=620');
          }
          if (network === 'facebook') {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`,'_blank','noopener,noreferrer,width=720,height=620');
          }
          if (network === 'x') {
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(pageTitle)}`,'_blank','noopener,noreferrer,width=720,height=620');
          }
          if (network === 'copy') {
            try {
              await navigator.clipboard.writeText(pageUrl);
              const status = document.querySelector('.copy-status');
              status.classList.add('is-visible');
              setTimeout(() => status.classList.remove('is-visible'), 1600);
            } catch (error) {
              window.prompt('Copy this link:', pageUrl);
            }
          }
        });
      });
    })();
  </script>
